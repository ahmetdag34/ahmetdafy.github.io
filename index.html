<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO::[ahmetdag34]</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- Fütüristik Tema Ayarları --- */
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --neon-cyan: #00fff2;
            --neon-purple: #bd00ff;
            --card-bg: rgba(255, 255, 255, 0.03);
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            line-height: 1.6;
            background-image: 
                linear-gradient(rgba(0, 255, 242, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 242, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        header {
            text-align: center; padding: 50px 0;
            border-bottom: 2px solid var(--neon-purple); margin-bottom: 40px;
            animation: flicker 4s infinite alternate;
        }

        h1 {
            font-size: 2.5rem; margin: 0; color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .subtitle { color: var(--neon-purple); font-size: 1rem; margin-top: 10px; display: block; }

        /* YÜKLENİYOR Animasyonu */
        #loading {
            text-align: center; font-size: 1.5rem; color: var(--neon-cyan); margin-top: 50px;
        }

        /* REPO KARTLARI GRID YAPISI */
        #repo-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .repo-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .repo-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 242, 0.2);
            transform: translateY(-5px);
        }

        .repo-name {
            color: var(--neon-cyan); font-size: 1.2rem; margin: 0 0 10px 0;
            text-decoration: none; display: block; font-weight: bold;
        }

        .repo-desc { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; flex-grow: 1; }

        .repo-stats {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; color: var(--neon-purple); border-top: 1px solid #333;
            padding-top: 10px;
        }

        .language-dot {
            height: 10px; width: 10px; background-color: var(--neon-cyan);
            border-radius: 50%; display: inline-block; margin-right: 5px;
        }

        footer { text-align: center; margin-top: 50px; color: #555; font-size: 0.8rem; }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 5
